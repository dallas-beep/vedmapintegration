<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events Map & Directory</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Pinned Top Bar Overlay - Guarantees Search Stays Above Leaflet */
    .top-controls {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 9999;
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: calc(100vw - 80px);
    }

    .filter-input {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
    }
    .filter-input:focus {
      border-color: #2563eb;
    }

    .btn {
      padding: 8px 14px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover {
      background: #1d4ed8;
    }

    .btn-reset {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    .btn-reset:hover {
      background: #e2e8f0;
    }

    /* Map fills screen */
    #map {
      height: 100vh;
      width: 100vw;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Popup Styling */
    .event-popup {
      font-size: 14px;
      line-height: 1.4;
      max-width: 260px;
    }
    .popup-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .popup-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      background-color: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Search & ZIP Controls pinned directly in body at z-index 9999 -->
  <div class="top-controls">
    <input 
      type="text" 
      id="keywordSearch" 
      class="filter-input" 
      placeholder="Search event name, host..."
      style="width: 200px;"
    />
    <input 
      type="text" 
      id="zipInput" 
      class="filter-input" 
      placeholder="ZIP Code" 
      maxlength="5"
      style="width: 90px;"
    />
    <select id="radiusSelect" class="filter-input" style="width: 90px;">
      <option value="15">15 mi</option>
      <option value="30" selected>30 mi</option>
      <option value="60">60 mi</option>
      <option value="120">120 mi</option>
    </select>
    <button id="searchZipBtn" class="btn">Search</button>
    <button id="resetAllBtn" class="btn btn-reset">Reset</button>
    <div id="statusTag" style="display: flex; align-items: center; font-size: 13px; color: #475569; padding-left: 4px;"></div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    const map = L.map('map').setView([39.8283, -98.5795], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let allEvents = [];
    let markerLayer = L.featureGroup().addTo(map);

    // Distance in miles (Haversine)
    function getDistanceMiles(lat1, lon1, lat2, lon2) {
      const R = 3958.8;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function displayMarkers(events) {
      markerLayer.clearLayers();
      const statusEl = document.getElementById('statusTag');

      if (!events || events.length === 0) {
        statusEl.textContent = '0 events found';
        return;
      }

      statusEl.textContent = `${events.length} event${events.length === 1 ? '' : 's'}`;

      events.forEach((item) => {
        const marker = L.marker([item.lat, item.lon]);
        const popup = `
          <div class="event-popup">
            <div class="popup-title">${item.title}</div>
            ${item.hostOrganization ? `<div><strong>Host:</strong> ${item.hostOrganization}</div>` : ''}
            ${item.date || item.time ? `<div><strong>When:</strong> ${item.date} ${item.time}</div>` : ''}
            ${item.address ? `<div><strong>Where:</strong> ${item.address}</div>` : ''}
            ${item.browserUrl ? `<a class="popup-btn" href="${item.browserUrl}" target="_blank" rel="noopener noreferrer">RSVP / Details</a>` : ''}
          </div>
        `;
        marker.bindPopup(popup);
        markerLayer.addLayer(marker);
      });

      map.fitBounds(markerLayer.getBounds(), { padding: [60, 60], maxZoom: 13 });
    }

    // Keyword Filter
    document.getElementById('keywordSearch').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        displayMarkers(allEvents);
        return;
      }
      const matches = allEvents.filter((item) => 
        (item.title && item.title.toLowerCase().includes(q)) ||
        (item.hostOrganization && item.hostOrganization.toLowerCase().includes(q)) ||
        (item.address && item.address.toLowerCase().includes(q))
      );
      displayMarkers(matches);
    });

    // ZIP Search
    document.getElementById('searchZipBtn').addEventListener('click', async () => {
      const zip = document.getElementById('zipInput').value.trim();
      const radius = parseFloat(document.getElementById('radiusSelect').value);

      if (!/^\d{5}$/.test(zip)) {
        alert('Please enter a 5-digit US ZIP code.');
        return;
      }

      try {
        const res = await fetch(`https://api.zippopotam.us/us/${zip}`);
        if (!res.ok) throw new Error('Invalid ZIP');
        const data = await res.json();
        const zipLat = parseFloat(data.places[0].latitude);
        const zipLon = parseFloat(data.places[0].longitude);

        const filtered = allEvents.filter((ev) => {
          return getDistanceMiles(zipLat, zipLon, ev.lat, ev.lon) <= radius;
        });

        displayMarkers(filtered);
      } catch (err) {
        alert('Could not find that ZIP code.');
      }
    });

    // Reset
    document.getElementById('resetAllBtn').addEventListener('click', () => {
      document.getElementById('keywordSearch').value = '';
      document.getElementById('zipInput').value = '';
      displayMarkers(allEvents);
    });

    // Fetch initial dataset
    fetch('/api/get-mobilize-events')
      .then((r) => r.json())
      .then((data) => {
        allEvents = data.data || [];
        displayMarkers(allEvents);
      })
      .catch((err) => {
        console.error(err);
        document.getElementById('statusTag').textContent = 'Error loading events';
      });
  </script>
</body>
</html>
