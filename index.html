<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events Map</title>
  
  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .event-popup {
      font-size: 14px;
      line-height: 1.4;
    }
    .popup-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }
    .popup-meta {
      color: #4b5563;
      margin-bottom: 4px;
    }
    .popup-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      background-color: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
    }
    .popup-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // Initialize map centered roughly on the US
    const map = L.map('map').setView([39.8283, -98.5795], 4);

    // Add OpenStreetMap tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const bounds = L.latLngBounds();

    // Fetch events from serverless endpoint
    fetch('/api/get-mobilize-events')
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        return res.json();
      })
      .then((response) => {
        const events = response.data || [];

        if (events.length === 0) {
          console.warn('No valid events with coordinates found.');
          return;
        }

        events.forEach((item) => {
          const marker = L.marker([item.lat, item.lon]).addTo(map);
          bounds.extend([item.lat, item.lon]);

          // Build popup HTML using event name as title
          const popupContent = `
            <div class="event-popup">
              <div class="popup-title">${item.title}</div>
              ${item.hostOrganization ? `<div class="popup-meta"><strong>Host:</strong> ${item.hostOrganization}</div>` : ''}
              ${item.date || item.time ? `<div class="popup-meta"><strong>When:</strong> ${item.date} ${item.time}</div>` : ''}
              ${item.address ? `<div class="popup-meta"><strong>Where:</strong> ${item.address}</div>` : ''}
              ${item.browserUrl ? `<a class="popup-btn" href="${item.browserUrl}" target="_blank" rel="noopener noreferrer">RSVP / Details</a>` : ''}
            </div>
          `;

          marker.bindPopup(popupContent);
        });

        // Fit map view to display all markers
        map.fitBounds(bounds, { padding: [40, 40] });
      })
      .catch((err) => {
        console.error('Failed to load events:', err);
      });
  </script>
</body>
</html>
