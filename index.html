<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote Early Day 2026 Event Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Helvetica, Arial, sans-serif; color: #2b1a40; background: #fff; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #app { display: flex; flex: 1; min-height: 0; }
  #sidebar { width: 340px; display: flex; flex-direction: column; border-right: 2px solid #5c2d91; background: #fff; }
  #tools { padding: 10px; background: #5c2d91; }
  #search { width: 100%; padding: 8px 10px; border: none; border-radius: 6px; font-size: 14px; }
  .tool-row { display: flex; gap: 8px; margin-top: 8px; }
  #radius, #locate { flex: 1; padding: 7px 8px; border: none; border-radius: 6px; font-size: 13px; }
  #locate { background: #fff; color: #5c2d91; font-weight: 700; cursor: pointer; }
  #status { color: #fff; font-size: 12px; margin-top: 8px; min-height: 16px; }
  #eventList { flex: 1; overflow-y: auto; }
  .event-item { padding: 10px 12px; border-bottom: 1px solid #eee; cursor: pointer; }
  .event-item:hover { background: #f4eefa; }
  .event-item h4 { margin: 0 0 4px; font-size: 14px; color: #551b7a; }
  .event-item p { margin: 2px 0; font-size: 12px; color: #444; }
  .empty { padding: 16px; font-size: 14px; color: #666; }
  #map { flex: 1; min-height: 0; }

  @media (max-width: 768px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; height: 30vh; border-right: none; border-bottom: 2px solid #5c2d91; }
    #map { flex: 1; height: auto; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="tools">
      <input id="search" type="search" placeholder="Search events, organizations, places">
      <div class="tool-row">
        <select id="radius">
          <option value="">Any distance</option>
          <option value="5">Within 5 miles</option>
          <option value="10">Within 10 miles</option>
          <option value="25">Within 25 miles</option>
        </select>
        <button id="locate" type="button">Use my location</button>
      </div>
      <div id="status">Loading events...</div>
    </div>
    <div id="eventList"></div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let allEvents = [];
  let userPos = null;
  const markers = L.layerGroup();

  const map = L.map('map').setView([39.8, -98.6], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  markers.addTo(map);

  const searchEl = document.getElementById('search');
  const radiusEl = document.getElementById('radius');
  const listEl = document.getElementById('eventList');
  const statusEl = document.getElementById('status');

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function safeUrl(u) {
    return /^https?:\/\//i.test(u || '') ? u : null;
  }

  function distanceMiles(lat1, lon1, lat2, lon2) {
    const R = 3958.8;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function popupHtml(e) {
    const url = safeUrl(e.registrationLink);
    return `
      <div style="max-width:280px; font-size:14px; line-height:1.4;">
        <h3 style="margin:0 0 8px; color:#551b7a; font-size:16px;">${escapeHtml(e.title)}</h3>
        ${e.hostOrganization ? `<p style="margin:4px 0;"><strong>Organization:</strong> ${escapeHtml(e.hostOrganization)}</p>` : ''}
        ${e.date ? `<p style="margin:4px 0;"><strong>Date:</strong> ${escapeHtml(e.date)}</p>` : ''}
        ${e.time ? `<p style="margin:4px 0;"><strong>Time:</strong> ${escapeHtml(e.time)}</p>` : ''}
        ${e.address ? `<p style="margin:4px 0;"><strong>Location:</strong> ${escapeHtml(e.address)}</p>` : ''}
        ${e.description ? `<p style="margin:4px 0; max-height:140px; overflow-y:auto;"><strong>Details:</strong> ${escapeHtml(e.description)}</p>` : ''}
        ${url ? `<p style="margin:10px 0 0;"><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" style="display:inline-block; padding:9px 18px; background:#6cc4a1; color:#3a1d5c; text-decoration:none; border-radius:6px; font-weight:700;">RSVP</a></p>` : ''}
      </div>`;
  }

  function focusEvent(e) {
    map.setView([e.lat, e.lon], Math.max(map.getZoom(), 9));
    if (e._marker) e._marker.openPopup();
  }

  function render(list) {
    markers.clearLayers();
    listEl.innerHTML = '';

    if (list.length === 0) {
      listEl.innerHTML = '<div class="empty">No events match your search.</div>';
    }

    list.forEach(e => {
      e._marker = L.marker([e.lat, e.lon]).bindPopup(popupHtml(e));
      e._marker.addTo(markers);

      const item = document.createElement('div');
      item.className = 'event-item';
      item.innerHTML = `
        <h4>${escapeHtml(e.title)}</h4>
        ${e.hostOrganization ? `<p>${escapeHtml(e.hostOrganization)}</p>` : ''}
        ${e.date ? `<p>${escapeHtml(e.date)}${e.time ? ' | ' + escapeHtml(e.time) : ''}</p>` : ''}
        ${e.address ? `<p>${escapeHtml(e.address)}</p>` : ''}`;
      item.addEventListener('click', () => focusEvent(e));
      listEl.appendChild(item);
    });

    const distNote = userPos && radiusEl.value ? ` within ${radiusEl.value} miles` : '';
    statusEl.textContent = `Showing ${list.length} of ${allEvents.length} events${distNote}`;
  }

  function applyFilters() {
    const q = searchEl.value.trim().toLowerCase();
    const r = Number(radiusEl.value);

    const list = allEvents.filter(e => {
      const haystack = `${e.title} ${e.hostOrganization} ${e.address} ${e.description}`.toLowerCase();
      if (q && !haystack.includes(q)) return false;
      if (r && userPos && distanceMiles(userPos.lat, userPos.lon, e.lat, e.lon) > r) return false;
      return true;
    });

    render(list);
  }

  searchEl.addEventListener('input', applyFilters);
  radiusEl.addEventListener('change', applyFilters);

  document.getElementById('locate').addEventListener('click', () => {
    if (!navigator.geolocation) {
      statusEl.textContent = 'Location is not available in this browser.';
      return;
    }
    statusEl.textContent = 'Finding your location...';
    navigator.geolocation.getCurrentPosition(pos => {
      userPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      if (!radiusEl.value) radiusEl.value = '25';
      map.setView([userPos.lat, userPos.lon], 9);
      applyFilters();
    }, () => {
      statusEl.textContent = 'Could not get your location. You can still search by keyword.';
    });
  });

  fetch('/api/get-mobilize-events')
    .then(r => r.json())
    .then(d => {
      allEvents = (d.data || []).filter(e => Number.isFinite(e.lat) && Number.isFinite(e.lon));
      if (allEvents.length) {
        map.fitBounds(L.latLngBounds(allEvents.map(e => [e.lat, e.lon])), { padding: [20, 20] });
      }
      applyFilters();
    })
    .catch(err => {
      console.error(err);
      statusEl.textContent = 'Error loading events. Please refresh the page.';
      listEl.innerHTML = '<div class="empty">Error loading events</div>';
    });
</script>
</body>
</html>
