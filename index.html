<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Events Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { --purple: #551b7a; --green: #6cb090; --border: #e0e0e0; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #f9f9f9; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .community-map-wrapper { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 20px; height: 88vh; min-height: 550px; max-width: 1400px; margin: 0 auto; }
    .map-sidebar-panel { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
    .search-controls-wrapper { display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 2px 5px #00000008; }
    .search-bar-container { position: relative; display: flex; align-items: center; }
    .search-bar-container input { width: 100%; padding: 12px 48px 12px 16px; border: 1px solid #ddd; border-radius: 30px; font-size: 14px; outline: none; }
    .search-bar-container input:focus { border-color: var(--purple); }
    .search-icon-btn { position: absolute; right: 6px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--purple); color: #fff; cursor: pointer; }
    .search-icon-btn:hover { background: var(--green); }
    .search-icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .radius-select-group { display: flex; align-items: center; gap: 8px; }
    .radius-select-group label { color: var(--purple); font-size: 13px; font-weight: 600; white-space: nowrap; }
    .radius-select-group select { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 13px; }
    .events-list-title { margin: 0; color: #111; font-size: 18px; }
    .event-sidebar-list { display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 4px; }
    .sidebar-event-card, .event-card-placeholder { padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
    .sidebar-event-card { cursor: pointer; box-shadow: 0 2px 4px #00000005; transition: .2s ease; }
    .sidebar-event-card:hover { border-color: var(--green); transform: translateY(-1px); }
    .sidebar-event-card h4 { margin: 0 0 4px; color: var(--purple); font-size: 16px; line-height: 1.2; }
    .sidebar-event-card p { margin: 4px 0 0; color: #557; font-size: 13px; }
    .event-card-placeholder { text-align: center; color: #777; font-size: 14px; }
    .map-status-bar { padding: 10px 16px; border-radius: 8px; background: var(--purple); color: #fff; font-size: 12px; font-weight: 600; text-align: center; }
    #interactiveMapContainer { width: 100%; height: 100%; min-height: 500px; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 2px 6px #0000000a; }
    .map-popup-box h3 { margin: 0 0 8px; color: var(--purple); font-size: 16px; }
    .map-popup-box p { margin: 4px 0; font-size: 13px; color: #444; }
    .rsvp-btn-popup { display: inline-block; margin-top: 10px; padding: 8px 14px; border-radius: 6px; background: var(--purple); color: #fff !important; font-size: 13px; font-weight: 600; text-decoration: none; }
    .rsvp-btn-popup:hover { background: var(--green); }
    @media (max-width: 900px) { body { padding: 10px; } .community-map-wrapper { grid-template-columns: 1fr; height: auto; min-height: 0; } .event-sidebar-list { max-height: 420px; } #interactiveMapContainer { height: 450px; min-height: 450px; } }
  </style>
</head>
<body>
  <main class="community-map-wrapper">
    <aside class="map-sidebar-panel">
      <div class="search-controls-wrapper">
        <div class="search-bar-container">
          <input id="zipSearchInput" type="search" placeholder="Filter by city, state, or zip..." autocomplete="off">
          <button id="searchBtn" class="search-icon-btn" type="button" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16a6.47 6.47 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
          </button>
        </div>
        <div class="radius-select-group">
          <label for="radiusSelect">Radius:</label>
          <select id="radiusSelect"><option value="all">Any distance</option><option value="1">&lt; 1 mile</option><option value="5">5 miles</option><option value="10">10 miles</option><option value="15">15 miles</option><option value="20">20 miles</option><option value="25">25 miles</option></select>
        </div>
      </div>
      <h2 class="events-list-title">Events List</h2>
      <div class="event-sidebar-list" id="eventSidebarList"><div class="event-card-placeholder">Loading events...</div></div>
      <div class="map-status-bar" id="mapStatus" role="status">Connecting...</div>
    </aside>
    <div id="interactiveMapContainer"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    let map;
    let markersLayer;
    let resolvedEvents = [];
    let filteredEvents = [];
    let searchLocation = null;
    let geocodeTimer;

    const byId = id => document.getElementById(id);
    const text = value => String(value ?? '');
    const escapeHtml = value => text(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    const milesBetween = (a, b) => {
      const radians = degrees => degrees * Math.PI / 180;
      const dLat = radians(b.lat - a.lat);
      const dLon = radians(b.lon - a.lon);
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(radians(a.lat)) * Math.cos(radians(b.lat)) * Math.sin(dLon / 2) ** 2;
      return 3958.8 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    };

    document.addEventListener('DOMContentLoaded', () => {
      map = L.map('interactiveMapContainer').setView([39.8283, -98.5795], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
      byId('searchBtn').addEventListener('click', () => filterEvents(true));
      byId('zipSearchInput').addEventListener('keydown', event => { if (event.key === 'Enter') filterEvents(true); });
      byId('zipSearchInput').addEventListener('input', () => { clearTimeout(geocodeTimer); geocodeTimer = setTimeout(() => filterEvents(false), 250); });
      byId('radiusSelect').addEventListener('change', () => filterEvents(true));
      loadEvents();
    });

    async function loadEvents() {
      byId('mapStatus').textContent = 'Loading events...';
      try {
        const response = await fetch('/api/get-mobilize-events', { headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error(`API error: ${response.status}`);
        const payload = await response.json();
        const events = Array.isArray(payload) ? payload : payload.data;
        resolvedEvents = (Array.isArray(events) ? events : []).map(event => ({
          id: text(event.id), title: text(event.title || 'Untitled event'), hostOrganization: text(event.hostOrganization),
          date: text(event.date), time: text(event.time), address: text(event.address), city: text(event.city),
          state: text(event.state), zip: text(event.zip), lat: Number(event.lat), lon: Number(event.lon), browserUrl: text(event.browserUrl)
        })).filter(event => Number.isFinite(event.lat) && Number.isFinite(event.lon));
        byId('mapStatus').textContent = `${resolvedEvents.length} events live`;
        filterEvents(false);
      } catch (error) {
        console.error('Unable to load events:', error);
        byId('mapStatus').textContent = 'Error loading events';
        byId('eventSidebarList').innerHTML = '<div class="event-card-placeholder">Events are temporarily unavailable.</div>';
      }
    }

    async function filterEvents(geocodeQuery) {
      const query = byId('zipSearchInput').value.trim().toLowerCase();
      const radius = byId('radiusSelect').value;
      if (radius !== 'all' && query && geocodeQuery) {
        try {
          const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`, { headers: { Accept: 'application/json' } });
          const locations = await response.json();
          searchLocation = locations[0] ? { lat: Number(locations[0].lat), lon: Number(locations[0].lon) } : null;
        } catch (error) { searchLocation = null; }
      } else if (!query || radius === 'all') searchLocation = null;

      filteredEvents = resolvedEvents.filter(event => {
        const matchesText = !query || [event.title, event.address, event.city, event.state, event.zip, event.hostOrganization].some(value => value.toLowerCase().includes(query));
        const matchesRadius = radius === 'all' || !searchLocation || milesBetween(searchLocation, event) <= Number(radius);
        return matchesText && matchesRadius;
      });
      renderMap();
    }

    function renderMap() {
      markersLayer.clearLayers();
      filteredEvents.forEach(event => {
        const marker = L.marker([event.lat, event.lon]).addTo(markersLayer);
        const link = event.browserUrl && /^https?:\/\//i.test(event.browserUrl) ? `<a href="${escapeHtml(event.browserUrl)}" target="_blank" rel="noopener noreferrer" class="rsvp-btn-popup">Registration Form</a>` : '';
        marker.bindPopup(`<div class="map-popup-box"><h3>${escapeHtml(event.title)}</h3>${event.hostOrganization ? `<p><strong>Host Organization:</strong> ${escapeHtml(event.hostOrganization)}</p>` : ''}${event.date ? `<p><strong>Date:</strong> ${escapeHtml(event.date)}</p>` : ''}${event.time ? `<p><strong>Time:</strong> ${escapeHtml(event.time)}</p>` : ''}${event.address ? `<p><strong>Location:</strong> ${escapeHtml(event.address)}</p>` : ''}${link}</div>`);
      });
      updateSidebar();
    }

    function updateSidebar() {
      const sidebar = byId('eventSidebarList');
      if (!filteredEvents.length) { sidebar.innerHTML = '<div class="event-card-placeholder">No events found</div>'; return; }
      sidebar.innerHTML = filteredEvents.map((event, index) => `<article class="sidebar-event-card" data-index="${index}"><h3>${escapeHtml(event.title)}</h3><p>${escapeHtml(event.address || 'Location unavailable')}</p>${event.date ? `<p>${escapeHtml(event.date)}${event.time ? ` · ${escapeHtml(event.time)}` : ''}</p>` : ''}</article>`).join('');
      sidebar.querySelectorAll('.sidebar-event-card').forEach(card => card.addEventListener('click', () => { const event = filteredEvents[Number(card.dataset.index)]; map.setView([event.lat, event.lon], 13); markersLayer.eachLayer(marker => { if (marker.getLatLng().lat === event.lat && marker.getLatLng().lng === event.lon) marker.openPopup(); }); }));
    }
  </script>
</body>
</html>
