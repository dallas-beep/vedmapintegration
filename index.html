<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vote Early Day 2026 - Event Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2937; }
    body { display: flex; flex-direction: column; overflow: hidden; }
         
    header { background: #5c2d91; color: #fff; padding: 16px 20px; text-align: center; flex-shrink: 0; }
    header h1 { margin: 0; font-size: 20px; font-weight: 800; }

    /* Mobile View Toggle Bar (Hidden on Desktop) */
    .mobile-nav-toggle { display: none; background: #4a2373; padding: 10px; justify-content: center; gap: 10px; flex-shrink: 0; }
    .mobile-nav-toggle button { background: #fff; color: #5c2d91; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .mobile-nav-toggle button.active { background: #6cb090; color: #fff; }

    .layout { display: grid; grid-template-columns: 380px 1fr; gap: 0; flex: 1; background: #f8fafc; min-height: 0; position: relative; }
    .sidebar { display: flex; flex-direction: column; min-height: 0; gap: 12px; padding: 16px; overflow-y: auto; background: #f8fafc; }
    .controls { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; flex-shrink: 0; }
    .search { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    .control-row { display: flex; gap: 8px; margin-top: 10px; }
    select, .location-button { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font-size: 13px; }
    .location-button { cursor: pointer; color: #fff; background: #551b7a; border-color: #551b7a; }
    .location-button:hover { background: #6cb090; border-color: #6cb090; }
    h2 { margin: 0; font-size: 16px; flex-shrink: 0; }
    .status { padding: 8px 12px; border-radius: 8px; background: #551b7a; color: #fff; font-size: 12px; font-weight: 600; text-align: center; flex-shrink: 0; }
    .event-list { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .event-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; cursor: pointer; flex-shrink: 0; }
    .event-card:hover { border-color: #6cb090; transform: translateY(-1px); }
    .event-card h3 { margin: 0 0 6px 0; color: #551b7a; font-size: 15px; font-weight: 700; }
    .event-card p { margin: 4px 0; color: #475569; font-size: 13px; line-height: 1.35; }
    .empty { padding: 22px 14px; text-align: center; color: #64748b; font-size: 14px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; }
    
    #map-container { display: flex; flex: 1; min-height: 0; position: relative; }
    #map { height: 100%; width: 100%; border: none; }

    .leaflet-popup-content { font-size: 13px; }
    .leaflet-popup-content h3 { margin: 0 0 10px 0; color: #551b7a; font-weight: 700; }
    .leaflet-popup-content p { margin: 6px 0; line-height: 1.4; }

    /* Mobile Responsive Adaptation */
    @media (max-width: 850px) {
      .mobile-nav-toggle { display: flex; }
      .layout { display: flex; flex-direction: column; }
      /* Default mobile view: Show Map, hide Sidebar */
      .sidebar { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; background: #f8fafc; padding: 12px; }
      #map-container { display: flex; width: 100%; height: 100%; }
      
      /* States controlled via body classes */
      body.show-list .sidebar { display: flex; }
      body.show-list #map-container { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Find Your Local Vote Early Day Celebration</h1>
  </header>

  <!-- Mobile View Toggle -->
  <div class="mobile-nav-toggle">
    <button id="btnMap" class="active" onclick="setMobileView('map')">🗺️ Map View</button>
    <button id="btnList" onclick="setMobileView('list')">📋 Event List (<span id="eventCountBadge">0</span>)</button>
  </div>

  <main class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="controls">
        <input id="search" class="search" type="search" placeholder="Search events..." />
        <div class="control-row">
          <select id="radius">
            <option value="all">Any distance</option>
            <option value="5">5 miles</option>
            <option value="10">10 miles</option>
            <option value="25">25 miles</option>
          </select>
          <button id="location" class="location-button">Use location</button>
        </div>
      </div>
      <h2>Events</h2>
      <div id="eventList" class="event-list"><div class="empty">Loading...</div></div>
      <div id="status" class="status">Connecting...</div>
    </aside>
    <div id="map-container">
      <div id="map"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([39.8283, -98.5795], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    const markerLayer = L.featureGroup().addTo(map);
    let allEvents = [];
    let userLocation = null;

    function setMobileView(view) {
      const body = document.body;
      const btnMap = document.getElementById('btnMap');
      const btnList = document.getElementById('btnList');
      if (view === 'map') {
        body.classList.remove('show-list');
        btnMap.classList.add('active');
        btnList.classList.remove('active');
        setTimeout(() => map.invalidateSize(), 100); // Fix Leaflet render grey tiles bug
      } else {
        body.classList.add('show-list');
        btnList.classList.add('active');
        btnMap.classList.remove('active');
      }
    }

    const escapeHtml = (v) => String(v || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    
    function milesBetween(a, b) {
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat), dLon = toRad(b.lon - a.lon);
      const x = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon/2)**2;
      return 3958.8 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
    }

    function filter() {
      const q = document.getElementById('search').value.toLowerCase();
      const r = document.getElementById('radius').value;
      const filtered = allEvents.filter(e => {
        const match = !q || e.title.toLowerCase().includes(q) || e.address.toLowerCase().includes(q);
        const dist = userLocation ? milesBetween(userLocation, e) : null;
        return match && (r === 'all' || !dist || dist <= Number(r));
      });
      render(filtered);
    }

    function render(events) {
      markerLayer.clearLayers();
      const list = document.getElementById('eventList');
      list.innerHTML = '';
      
      document.getElementById('eventCountBadge').textContent = events.length;

      if (!events.length) { 
        list.innerHTML = '<div class="empty">No events found</div>'; 
        return; 
      }

      events.forEach(e => {
        const popupHtml = `
          <div style="max-width: 280px;">
            <h3 style="margin: 0 0 8px 0; color: #551b7a; font-size: 15px; font-weight: 700;">${escapeHtml(e.title)}</h3>
            ${e.hostOrganization ? `<p style="margin: 4px 0;"><strong>Organization:</strong> ${escapeHtml(e.hostOrganization)}</p>` : ''}
            ${e.date ? `<p style="margin: 4px 0;"><strong>Date:</strong> ${escapeHtml(e.date)}</p>` : ''}
            ${e.time ? `<p style="margin: 4px 0;"><strong>Time:</strong> ${escapeHtml(e.time)}</p>` : ''}
            ${e.address ? `<p style="margin: 4px 0;"><strong>Location:</strong> ${escapeHtml(e.address)}</p>` : ''}
            ${e.description ? `<p style="margin: 4px 0;"><strong>Details:</strong> ${escapeHtml(e.description)}</p>` : ''}
          </div>
        `;
        const marker = L.marker([e.lat, e.lon]).bindPopup(popupHtml).addTo(markerLayer);
                 
        const card = document.createElement('div');
        card.className = 'event-card';
        card.innerHTML = `
          <h3>${escapeHtml(e.title)}</h3>
          ${e.hostOrganization ? `<p><strong>${escapeHtml(e.hostOrganization)}</strong></p>` : ''}
          ${e.date ? `<p><strong>Date:</strong> ${escapeHtml(e.date)}</p>` : ''}
          ${e.time ? `<p><strong>Time:</strong> ${escapeHtml(e.time)}</p>` : ''}
          <p>${escapeHtml(e.address)}</p>
        `;
        // When clicking an event card on mobile, jump to map view and zoom in on that marker
        card.addEventListener('click', () => {
          map.setView([e.lat, e.lon], 13);
          setMobileView('map');
          marker.openPopup();
        });
        list.appendChild(card);
      });
      document.getElementById('status').textContent = `${events.length} event${events.length===1?'':'s'}`;
    }

    document.getElementById('search').addEventListener('input', filter);
    document.getElementById('radius').addEventListener('change', filter);
    document.getElementById('location').addEventListener('click', () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(p => {
        userLocation = {lat: p.coords.latitude, lon: p.coords.longitude};
        map.setView([userLocation.lat, userLocation.lon], 10);
        filter();
      });
    });

    fetch('/api/get-mobilize-events').then(r => r.json()).then(d => {
      allEvents = (d.data || []).filter(e => !isNaN(e.lat) && !isNaN(e.lon));
      filter();
    }).catch(e => {
      console.error(e);
      document.getElementById('eventList').innerHTML = '<div class="empty">Error loading events</div>';
    });
  </script>
</body>
</html>
